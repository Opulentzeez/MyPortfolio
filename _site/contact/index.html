<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

<body>

<header>
  <nav>
    <div class="logo">Azeez Bakare</div>
    <button class="menu-toggle" aria-label="Toggle menu">☰</button>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>

      <li><a href="/blog/">Blog</a></li>

    </ul>
  </nav>
</header>

<main>
  <section class="page-content">
  <h1>Enroll with me</h1>
  <p>Tell me a bit about your goals and I'll get back to you.</p>

  <form class="contact-form" action="YOUR_FORMSPREE_URL" method="POST">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label for="message">What are you working on?</label>
    <textarea id="message" name="message" rows="5" required></textarea>

    <button type="submit" class="btn">Send</button>
  </form>
</section>
</main>
